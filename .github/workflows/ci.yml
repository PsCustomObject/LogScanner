name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable]
        include:
          - os: ubuntu-latest
            go: '1.23.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build and smoke-test native CLI
        run: python scripts/smoke-test.py
