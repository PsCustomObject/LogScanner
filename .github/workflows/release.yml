name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh scripts/build-release.sh "$RELEASE_TAG"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/logscanner-* dist/SHA256SUMS.txt \
            LICENSE \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
